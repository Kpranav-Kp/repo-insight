target-version = "py311"
src = ["core", "repoinsight"]
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "migrations",
]

[lint]
select = ["E", "W", "F", "I", "UP", "DJ", "S", "B"]
ignore = [
    "E501",
    "DJ001",
]

[lint.isort]
known-third-party = [
    "django",
    "rest_framework",
    "celery",
    "sentence_transformers",
    "faiss",
    "numpy",
    "tenacity",
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
